# --- ONSITE VERSION --------------------------------------------------------
#   Vagrantfile will automatically select the active NIC for a bridged adapter

# --- AVAILABLE KEYS --------------------------------------------------------
#
# GENERAL
#   name            (required)  Hostname, also used to find provisioning script
#   box             (optional)  Base box, default: bento/almalinux-10.1
#
# RESOURCES         (optional, defaults: 1024 MB / 1 CPU)
#   memory                      RAM in MB  (e.g. 512, 2048)
#   cpus                        Number of virtual CPUs
#
# NETWORKING        (optional)
#   ip                          Static IP — omit for DHCP
#   netmask                     Default: 255.255.255.0
#   intnet: 'name'              Internal network — isolated, VM-to-VM only.
#                               VMs sharing the same name can communicate.
#                               Use for local testing without physical network.
#   bridge: true                Bridged adapter — VM appears as real device on
#                               physical network/VLAN. Use for multi-machine
#                               physical setups. Takes priority over intnet.
#
# PROVISIONING      (optional)
#   stagedprovisioning: true    Run multiple scripts with reboots in between.
#                               Scripts: provisioning/<n>-stage1.ps1, -stage2.ps1 ...
#                               Omit for single script: provisioning/<n>.sh / .ps1
#
#   localprovisioning: true     Windows DC hybrid mode: the provisioning directory
#                               is mounted read-only via VirtualBox shared folder at
#                               C:\vagrant-provisioning, then copied to C:\provisioning
#                               before the first stage runs.  This protects against
#                               the vboxsf service racing against boot after DC
#                               promotion.
#                               Omit (or false) for plain shared-folder access:
#                               provisioning is mounted directly at C:\provisioning
#                               and read live from the host -- no file transfer.

