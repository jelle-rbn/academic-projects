hostname R1
!
no ip domain lookup
!
! =========================
! DHCP (Clients VLAN 22)
! =========================
!
ip dhcp excluded-address 192.168.132.129
!
ip dhcp pool EMPLOYEES
   network 192.168.132.128 255.255.255.192
   default-router 192.168.132.129
   dns-server 192.168.132.194
!
! =========================
! NAT CONFIG (PAT)
! =========================
!
access-list 1 permit 192.168.132.128 0.0.0.63
access-list 1 permit 192.168.132.192 0.0.0.31
access-list 1 permit 192.168.132.232 0.0.0.7
access-list 1 permit 192.168.132.224 0.0.0.7
!
ip nat inside source list 1 interface GigabitEthernet 0/0/0 overload
!
! =========================
! ACL VLAN 33
! =========================
!
ip access-list extended ACL_VLAN33
   !
   remark === DC: FULL RESPONSE ACCESS TO CLIENTS ===
   permit ip host 192.168.132.194 192.168.132.128 0.0.0.63
   !
   remark === ESTABLISHED RETURN TRAFFIC ===
   permit tcp 192.168.132.192 0.0.0.31 any established
   !
   remark === SMB (UDP) RESPONSES TO CLIENTS ===
   permit udp host 192.168.132.199 eq 445 192.168.132.128 0.0.0.63
   !
   remark === DC TO REVERSE PROXY ===
   permit udp host 192.168.132.194 eq 53 host 192.168.132.234
   !
   remark === ICMP ===
   permit icmp 192.168.132.192 0.0.0.31 any
   !
   remark === DHCP ===
   permit udp any eq 68 any eq 67
   !
   remark === BLOCK SERVER-INITIATED INTERNAL ACCESS ===
   deny ip 192.168.132.192 0.0.0.31 192.168.132.128 0.0.0.63
   deny ip 192.168.132.192 0.0.0.31 192.168.132.232 0.0.0.7
   deny ip 192.168.132.192 0.0.0.31 192.168.132.224 0.0.0.7
   !
   remark === ALLOW REMAINING INTERNET ACCESS (DNS FORWARDING, NTP, UPDATES) ===
   permit ip 192.168.132.192 0.0.0.31 any
   !
   remark === DEFAULT DENY ===
   deny ip any any log
exit
   !
   interface GigabitEthernet0/0/1.33
   ip access-group ACL_VLAN33 in
exit
!
! =========================
! ACL VLAN 1
! =========================
!
ip access-list extended ACL_VLAN1
   !
   remark === MANAGEMENT FULL ACCESS ===
   permit ip 192.168.132.224 0.0.0.7 any
   !
   remark === DHCP ===
   permit udp any eq 68 any eq 67
   permit udp any eq 67 any eq 68
   !
   remark === ICMP ===
   permit icmp 192.168.132.224 0.0.0.7 any
   !
   remark === DEFAULT DENY ===
   deny ip any any log
exit
   !
   interface GigabitEthernet0/0/1
   ip access-group ACL_VLAN1 in
exit
!
! =========================
! ACL VLAN 11
! =========================
!
ip access-list extended ACL_VLAN11
   !
   remark === REVERSE PROXY -> INTERNAL WEBSERVERS ===
   permit tcp 192.168.132.232 0.0.0.7 host 192.168.132.196 eq 80
   permit tcp 192.168.132.232 0.0.0.7 host 192.168.132.196 eq 443
   permit tcp 192.168.132.232 0.0.0.7 host 192.168.132.197 eq 80
   permit tcp 192.168.132.232 0.0.0.7 host 192.168.132.197 eq 443
   !
   remark === PROXY TO DC FOR DNS ===
   permit udp host 192.168.132.234 host 192.168.132.194 eq 53
   permit tcp host 192.168.132.234 host 192.168.132.194 eq 53
   !
   remark === RETURN TRAFFIC ===
   permit tcp 192.168.132.232 0.0.0.7 any established
   !
   remark === ICMP ===
   permit icmp 192.168.132.232 0.0.0.7 any
   !
   remark === BLOCK ACCESS TO INTERNAL VLANS ===
   deny ip 192.168.132.232 0.0.0.7 192.168.132.128 0.0.0.63
   deny ip 192.168.132.232 0.0.0.7 192.168.132.192 0.0.0.31
   deny ip 192.168.132.232 0.0.0.7 192.168.132.224 0.0.0.7
   !
   remark === INTERNET ACCESS ===
   permit ip 192.168.132.232 0.0.0.7 any
   !
   remark === DEFAULT DENY ===
   deny ip any any log
exit
   !
   interface GigabitEthernet0/0/1.11
   ip access-group ACL_VLAN11 in
exit
!
! =========================
! ACL VLAN 22
! =========================
!
ip access-list extended ACL_VLAN22
   !
   remark === DHCP ===
   permit udp any eq 68 any eq 67
   permit udp any eq 67 any eq 68
   !
   remark === FULL ACCESS TO DC (AD SERVICES) ===
   permit ip 192.168.132.128 0.0.0.63 host 192.168.132.194
   !
   remark === CLIENT -> STORAGE (SMB) ===
   permit tcp 192.168.132.128 0.0.0.63 host 192.168.132.199 eq 445
   permit udp 192.168.132.128 0.0.0.63 host 192.168.132.199 eq 445
   !
   remark === CLIENT -> REVERSE PROXY ===
   permit tcp 192.168.132.128 0.0.0.63 host 192.168.132.234 eq 80
   permit tcp 192.168.132.128 0.0.0.63 host 192.168.132.234 eq 443
   !
   remark === RETURN TRAFFIC ===
   permit tcp 192.168.132.128 0.0.0.63 any established
   !
   remark === ICMP ===
   permit icmp 192.168.132.128 0.0.0.63 any
   !
   remark === BLOCK LATERAL MOVEMENT ===
   deny ip 192.168.132.128 0.0.0.63 192.168.132.192 0.0.0.31
   deny ip 192.168.132.128 0.0.0.63 192.168.132.232 0.0.0.7
   deny ip 192.168.132.128 0.0.0.63 192.168.132.224 0.0.0.7
   !
   remark === INTERNET ACCESS ===
   permit ip 192.168.132.128 0.0.0.63 any
   !
   remark === DEFAULT DENY ===
   deny ip any any log
exit
   !
   interface GigabitEthernet0/0/1.22
   ip access-group ACL_VLAN22 in
exit
!
! =========================
! ACL OUTSIDE - WAN INTERFACE
! =========================
!
ip access-list extended ACL_OUTSIDE
   !
   remark === ANTI-SPOOFING ===
   deny ip 10.0.0.0 0.255.255.255 any
   deny ip 172.16.0.0 0.15.255.255 any
   deny ip 192.168.0.0 0.0.255.255 any
   deny ip 127.0.0.0 0.255.255.255 any
   !
   remark === DHCP FROM ISP ===
   permit udp any eq 67 any eq 68
   !
   remark === STATEFUL RETURN TRAFFIC ===
   permit tcp any any established
   !
   remark === DNS + NTP RESPONSES ===
   permit udp any eq 53 any
   permit udp any eq 123 any
   !
   remark === ICMP ===
   permit icmp any any
   !
   remark === PUBLIC ACCESS TO REVERSE PROXY ===
   permit tcp any host 192.168.132.234 eq 80
   permit tcp any host 192.168.132.234 eq 443
   !
   remark === DEFAULT DENY ===
   deny ip any any log
exit
   !
   interface GigabitEthernet0/0/0
   ip access-group ACL_OUTSIDE in
exit
!
! =========================
! INTERFACES
! =========================
!
interface GigabitEthernet 0/0/0
   description UPLINK TO CLASS NETWORK
   ip address dhcp
   ip nat outside
   ip access-group ACL_OUTSIDE in
   no shutdown
   !
   ! Physical interface for VLAN 1 (Native/Management)
   interface GigabitEthernet 0/0/1
   description LAN TRUNK - VLAN 1 UNTAGGED (MANAGEMENT)
   ip address 192.168.132.225 255.255.255.248
   ip access-group ACL_VLAN1 in
   ip nat inside
   no shutdown
   !
   interface GigabitEthernet 0/0/1.11
   encapsulation dot1Q 11
   ip address 192.168.132.233 255.255.255.248
   ip access-group ACL_VLAN11 in
   ip nat inside
   !
   interface GigabitEthernet 0/0/1.22
   encapsulation dot1Q 22
   ip address 192.168.132.129 255.255.255.192
   ip access-group ACL_VLAN22 in
   ip nat inside
   !
   interface GigabitEthernet 0/0/1.33
   encapsulation dot1Q 33
   ip address 192.168.132.193 255.255.255.224
   ip access-group ACL_VLAN33 in
   ip nat inside
   !
   ! =========================
   ! ROUTING
   ! =========================
   !
   ip route 0.0.0.0 0.0.0.0 172.22.255.254
   !
   line vty 0 4
   login local
   transport input ssh
   !
end