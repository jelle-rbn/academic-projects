hostname S1
!
no ip domain-lookup
!
! =========================
! VLAN DEFINITIONS
! =========================
!
vlan 11
 name DMZ
vlan 22
 name EMPLOYEES
vlan 33
 name SERVERS
vlan 999
 name BLACKHOLE
!
! =========================
! INTERFACES
! =========================
!
! ---- MANAGEMENT (VLAN 1)
interface FastEthernet 0/1
 description MANAGEMENT VLAN
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
!
! ---- DMZ (TFTP)
interface FastEthernet 0/3
 description VLAN 11 - DMZ
 switchport mode access
 switchport access vlan 11
 spanning-tree portfast
!
! ---- CLIENTS (EMPLOYEES)
interface FastEthernet 0/5
 description VLAN 22 - EMPLOYEES
 switchport mode access
 switchport access vlan 22
 spanning-tree portfast
!
! ---- SERVERS
interface FastEthernet 0/7
 description VLAN 33 - SERVERS
 switchport mode access
 switchport access vlan 33
 spanning-tree portfast
!
interface FastEthernet 0/8
 description VLAN 33 - SERVERS
 switchport mode access
 switchport access vlan 33
 spanning-tree portfast
!
! =========================
! UNUSED PORTS (BLACKHOLE)
! =========================
!
interface FastEthernet 0/2
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/4
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/6
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/9
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/10
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/11
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/12
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/13
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/14
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/15
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/16
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/17
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/18
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/19
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/20
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/21
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/22
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/23
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface FastEthernet 0/24
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet 0/2
 switchport mode access
 switchport access vlan 999
 shutdown
exit
!
! =========================
! TRUNK TO ROUTER
! =========================
!
interface GigabitEthernet 0/1
 description TRUNK TO ROUTER R1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,11,22,33
 no shutdown
exit
!
! =========================
! MANAGEMENT INTERFACE
! =========================
!
interface Vlan 1
 ip address 192.168.132.226 255.255.255.248
 no shutdown
exit
!
ip default-gateway 192.168.132.225
!
! =========================
! VTY (REMOTE ACCESS)
! =========================
!
line vty 0 15
 transport input ssh
 login local
!
end